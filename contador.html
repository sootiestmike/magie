<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nuestro Tiempo ❤️</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ffd6b0, #ffe7d6);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
    }

    .container{
      text-align:center;
      z-index:2;
      padding:40px;
      border-radius:30px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      width:90%;
      max-width:900px;
    }

    h1{
      color:white;
      font-size:3rem;
      margin-bottom:20px;
      text-shadow:2px 2px 10px rgba(0,0,0,0.2);
    }

    p{
      color:white;
      font-size:1.2rem;
      margin-bottom:30px;
    }

    .contador{
      display:flex;
      gap:20px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .tiempo{
      background: rgba(255,255,255,0.2);
      padding:20px;
      border-radius:20px;
      min-width:120px;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }

    .numero{
      font-size:2.5rem;
      color:white;
      font-weight:bold;
    }

    .texto{
      color:white;
      margin-top:8px;
      font-size:1rem;
    }

    /* Corazones flotando */
    .heart{
      position:absolute;
      color:rgba(255,255,255,0.7);
      animation: float linear infinite;
      user-select:none;
    }

    @keyframes float{
      from{
        transform: translateY(100vh) scale(1);
        opacity:0;
      }

      10%{
        opacity:1;
      }

      to{
        transform: translateY(-10vh) scale(1.6);
        opacity:0;
      }
    }

    @media(max-width:700px){

      h1{
        font-size:2rem;
      }

      .contador{
        gap:10px;
      }

      .tiempo{
        min-width:90px;
        padding:15px;
      }

      .numero{
        font-size:2rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>❤️ Desde el 21 de Marzo ❤️</h1>
    <p>Gracias por cada momento contigo Magie, te quiero 💕</p>

    <div class="contador">

      <div class="tiempo">
        <div class="numero" id="meses">0</div>
        <div class="texto">Meses</div>
      </div>

      <div class="tiempo">
        <div class="numero" id="dias">0</div>
        <div class="texto">Días</div>
      </div>

      <div class="tiempo">
        <div class="numero" id="horas">0</div>
        <div class="texto">Horas</div>
      </div>

      <div class="tiempo">
        <div class="numero" id="minutos">0</div>
        <div class="texto">Minutos</div>
      </div>

      <div class="tiempo">
        <div class="numero" id="segundos">0</div>
        <div class="texto">Segundos</div>
      </div>

    </div>
  </div>

  <script>

    
    const fechaInicio = new Date("2026-03-21T00:00:00");

    function actualizarContador(){

      const ahora = new Date();

      let años = ahora.getFullYear() - fechaInicio.getFullYear();
      let meses = ahora.getMonth() - fechaInicio.getMonth();
      let dias = ahora.getDate() - fechaInicio.getDate();

      if(dias < 0){
        meses--;
        const ultimoMes = new Date(
          ahora.getFullYear(),
          ahora.getMonth(),
          0
        ).getDate();

        dias += ultimoMes;
      }

      if(meses < 0){
        años--;
        meses += 12;
      }

      const diferencia = ahora - fechaInicio;

      const segundosTotales = Math.floor(diferencia / 1000);

      const horas = Math.floor(segundosTotales / 3600) % 24;
      const minutos = Math.floor(segundosTotales / 60) % 60;
      const segundos = segundosTotales % 60;

      const mesesTotales = (años * 12) + meses;

      document.getElementById("meses").innerText = mesesTotales;
      document.getElementById("dias").innerText = dias;
      document.getElementById("horas").innerText = horas;
      document.getElementById("minutos").innerText = minutos;
      document.getElementById("segundos").innerText = segundos;
    }

    actualizarContador();
    setInterval(actualizarContador, 1000);

    
    for(let i = 0; i < 50; i++){

      const heart = document.createElement("div");

      heart.classList.add("heart");

      heart.innerHTML = "❤";

      heart.style.left = Math.random() * 100 + "vw";

      heart.style.fontSize = (15 + Math.random() * 30) + "px";

      heart.style.animationDuration = (5 + Math.random() * 10) + "s";

      heart.style.animationDelay = Math.random() * 5 + "s";

      document.body.appendChild(heart);
    }

  </script>

</body>
</html>
